spring.application.name=reconciliation

# ---------- Database (local default: file-based H2, so restarts can resume) ----------
spring.datasource.url=jdbc:h2:file:./data/recon
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Our tables come from schema.sql + data-<platform>.sql, not from Hibernate
spring.sql.init.mode=always
spring.sql.init.platform=h2
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100

# ---------- Spring Batch ----------
# Create the BATCH_* metadata tables (in production, prefer Flyway/Liquibase)
spring.batch.jdbc.initialize-schema=always
# Do not run the job at startup: the scheduler or the REST endpoint launches it
spring.batch.job.enabled=false

# Chunk size = reader page size. 3 so you can watch chunks with 6 rows; ~1000 in production.
batch.chunk-size=3
# Threads for the branch partitions. Keep below the DB connection pool size (Hikari default: 10).
batch.partition-threads=4

# ---------- Scheduling ----------
reconciliation.scheduler.enabled=true
# Spring cron has 6 fields: second minute hour day-of-month month day-of-week
reconciliation.cron=0 30 1 * * *
reconciliation.zone=Asia/Kolkata
